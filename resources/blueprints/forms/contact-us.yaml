tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: name
            field:
              type: text
              display: Name
              validate:
                - required
          -
            handle: email
            field:
              input_type: email
              type: text
              display: Email
              validate:
                - required
          -
            handle: phone_number
            field:
              input_type: tel
              type: text
              display: 'Phone Number'
              validate:
                - required
          -
            handle: help_topic
            field:
              options:
                -
                  key: send-a-tip
                  value: 'Send a tip'
                -
                  key: correction
                  value: Correction
                -
                  key: subscribe
                  value: Subscribe
                -
                  key: letter
                  value: 'Letter to the desk'
                -
                  key: other
                  value: Other
              type: select
              display: 'How can we help?'
              validate:
                - required
          -
            handle: message
            field:
              type: textarea
              display: Message
              validate:
                - required
